[package]
name = "omabridge-mobile"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["staticlib", "rlib"]
[features]
default = []
lab-tls = ["dep:reqwest012"]
[dependencies]
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
omabridge = { path = ".." }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }

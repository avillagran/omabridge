[package]
name = "omabridge"
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
authors = ["OmaBridge contributors"]
license = "MIT"
repository = "https://github.com/avillagran/omabridge"
readme = "README.md"
keywords = ["p2p", "iroh", "quic", "tunnel", "t3"]
categories = ["network-programming", "command-line-utilities"]
description = "Private device pairing and encrypted service bridges, starting with T3 Code"

[features]
default = []
gui = ["dep:eframe"]

[[bin]]
name = "omabridge-gui"
path = "src/gui.rs"
required-features = ["gui"]

[[test]]
name = "gui_cli"
path = "tests/gui_cli.rs"
required-features = ["gui"]

[dependencies]
t3-protocol = { git = "https://github.com/avillagran/lib-t3-rust", rev = "8c80c4dc62414c454eaefb4706d973adf8d8ee74" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
fs2 = "0.4"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server", "tls-ring"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "signal", "sync", "macros", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = { version = "=0.18.1", default-features = false }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace]
members = ["mobile-sdk"]
resolver = "3"
